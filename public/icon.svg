<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="courtBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F392B"/>
      <stop offset="100%" stop-color="#082219"/>
    </linearGradient>
    <linearGradient id="paddleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E6B52"/>
      <stop offset="100%" stop-color="#124434"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2FF59"/>
      <stop offset="100%" stop-color="#C5E627"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#courtBg)"/>
  
  <!-- Court subtle grid lines -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="none" stroke="#256B52" stroke-width="6" opacity="0.4"/>
  <line x1="76" y1="256" x2="436" y2="256" stroke="#256B52" stroke-width="5" opacity="0.5"/>
  <line x1="256" y1="76" x2="256" y2="256" stroke="#256B52" stroke-width="4" opacity="0.5"/>
  
  <!-- Paddle -->
  <g filter="url(#shadow)" transform="rotate(-18 240 270)">
    <!-- Paddle handle -->
    <rect x="226" y="320" width="36" height="110" rx="10" fill="#2B2D2F"/>
    <rect x="230" y="330" width="28" height="90" rx="6" fill="#1C1E20"/>
    <line x1="226" y1="350" x2="262" y2="350" stroke="#E2F952" stroke-width="3" opacity="0.6"/>
    <line x1="226" y1="380" x2="262" y2="380" stroke="#E2F952" stroke-width="3" opacity="0.6"/>
    <!-- Paddle face -->
    <rect x="170" y="140" width="148" height="190" rx="44" fill="url(#paddleGrad)" stroke="#E2F952" stroke-width="7"/>
    <!-- Subtle sweet spot curve -->
    <circle cx="244" cy="235" r="46" fill="none" stroke="#2D8567" stroke-width="4" stroke-dasharray="6 6"/>
    <!-- Pickle ball logo on paddle -->
    <circle cx="244" cy="235" r="16" fill="#E2F952" opacity="0.8"/>
  </g>
  
  <!-- Pickleball (with iconic holes) -->
  <g filter="url(#shadow)">
    <circle cx="342" cy="184" r="54" fill="url(#ballGrad)" stroke="#A2C318" stroke-width="4"/>
    <!-- Holes -->
    <circle cx="342" cy="184" r="8.5" fill="#153629" opacity="0.85"/>
    <circle cx="320" cy="164" r="7.5" fill="#153629" opacity="0.85"/>
    <circle cx="364" cy="164" r="7.5" fill="#153629" opacity="0.85"/>
    <circle cx="320" cy="204" r="7.5" fill="#153629" opacity="0.85"/>
    <circle cx="364" cy="204" r="7.5" fill="#153629" opacity="0.85"/>
    <circle cx="342" cy="144" r="6" fill="#153629" opacity="0.85"/>
    <circle cx="342" cy="224" r="6" fill="#153629" opacity="0.85"/>
    <circle cx="298" cy="184" r="6" fill="#153629" opacity="0.85"/>
    <circle cx="386" cy="184" r="6" fill="#153629" opacity="0.85"/>
  </g>
</svg>
